<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="back back-right"></div>
    <div class="back back-left"></div>

    <main class="card">
      <h1>CONTACT US</h1>

      <form id="contactForm" novalidate>
        <div class="row">
          <div class="field">
            <label for="firstName">First Name <span class="req">*</span></label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
            <small class="error" data-for="firstName"></small>
          </div>
          <div class="field">
            <label for="lastName">Last Name <span class="req">*</span></label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
            <small class="error" data-for="lastName"></small>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <small class="error" data-for="email"></small>
          </div>
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">
            <small class="error" data-for="phone"></small>
          </div>
        </div>

        <fieldset class="field contact-method">
          <legend>Preferred Method of Contact <span class="req">*</span></legend>
          <label class="radio"><input type="radio" name="contactMethod" value="Email"> <span>Email</span></label>
          <label class="radio"><input type="radio" name="contactMethod" value="Phone"> <span>Phone</span></label>
          <small class="error" data-for="contactMethod"></small>
        </fieldset>

        <div class="field">
          <label for="inquiry">Your Inquiry</label>
          <textarea id="inquiry" name="inquiry" rows="5"></textarea>
        </div>

        <button type="submit" id="submitBtn">GET IN TOUCH</button>
        <p id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
