<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google reCAPTCHA v2 (replace data-sitekey below with your own key) -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <main class="page">
    <div class="card">
      <h1 class="card__title">Contact Us</h1>

      <form id="contactForm" novalidate>
        <div class="row">
          <div class="field">
            <label for="firstName">First Name <span class="req">*</span></label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name" required />
            <small class="error" data-for="firstName"></small>
          </div>
          <div class="field">
            <label for="lastName">Last Name <span class="req">*</span></label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name" required />
            <small class="error" data-for="lastName"></small>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <small class="error" data-for="email"></small>
          </div>
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" />
            <small class="error" data-for="phone"></small>
          </div>
        </div>

        <fieldset class="field radio-group">
          <legend>Preferred Method of Contact <span class="req">*</span></legend>
          <label class="radio">
            <input type="radio" name="contactMethod" value="Email" />
            <span>Email</span>
          </label>
          <label class="radio">
            <input type="radio" name="contactMethod" value="Phone" />
            <span>Phone</span>
          </label>
          <small class="error" data-for="contactMethod"></small>
        </fieldset>

        <div class="field">
          <label for="inquiry">Your Inquiry</label>
          <textarea id="inquiry" name="inquiry" rows="5"></textarea>
        </div>

        <div class="field">
          <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>
          <small class="error" data-for="captcha"></small>
        </div>

        <button type="submit" class="btn" id="submitBtn">Get in touch</button>
        <p class="status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
